<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <title>Analyse-Report · Unfallkarte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Analyse-Report der Unfallkarte: Unfalllage, schutzbedürftige Nutzungen, Straße und Lärm an einer Stelle – mit rechtlicher Einordnung (§ 45 StVO) und Briefentwurf an die Behörde. Datenbasierte Einschätzung, keine Rechtsberatung." />
  <link rel="icon" href="stationary-bike-gym-svgrepo-com.svg" type="image/svg+xml">
  <!-- Wie die Karte: Grundkarte (OpenFreeMap) und Datenbucket (B2) per fetch/CORS. -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preconnect" href="https://tiles.vizsim.de" crossorigin>
  <link rel="stylesheet" href="./js/report/report.css" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./index.html" title="Zur Karte">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#c1121f" stroke-width="4"/><text x="20" y="25.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#111">30</text></svg>
        <span class="brand-name">Unfallkarte <span>/ Analyse-Report</span></span>
      </a>
      <span class="badge">Beta · Regelwerk <span id="rw-version">0.1</span></span>
      <span class="spacer"></span>
      <span class="note">Datenbasierte Einschätzung aus den Daten der Unfallkarte – keine Rechtsberatung, kein Gutachten, keine amtliche Feststellung. Regelwerk und Briefbausteine sind juristisch zu prüfen.</span>
    </header>

    <div class="steps" role="tablist" aria-label="Ablauf">
      <button class="step" role="tab" id="tab-auswahl" aria-controls="view-auswahl" data-tab="auswahl"><span class="n">1</span>Auswahl</button>
      <button class="step" role="tab" id="tab-report" aria-controls="view-report" data-tab="report"><span class="n">2</span>Report</button>
      <button class="step" role="tab" id="tab-brief" aria-controls="view-brief" data-tab="brief"><span class="n">3</span>Brief</button>
      <button class="step" role="tab" id="tab-pdf" aria-controls="view-pdf" data-tab="pdf"><span class="n">4</span>Druckansicht (PDF)</button>
    </div>

    <section id="view-auswahl" role="tabpanel" aria-labelledby="tab-auswahl">
      <div class="selgrid">
        <div class="mapwrap"><div id="selmap"></div><div class="map-hint" id="map-hint">Klick setzt den Mittelpunkt der Auswahl</div></div>
        <div class="panel selpanel" id="selpanel"></div>
      </div>
    </section>
    <section id="view-report" role="tabpanel" aria-labelledby="tab-report" hidden></section>
    <section id="view-brief" role="tabpanel" aria-labelledby="tab-brief" hidden></section>
    <section id="view-pdf" role="tabpanel" aria-labelledby="tab-pdf" hidden></section>
  </div>
  <noscript>Der Analyse-Report braucht JavaScript.</noscript>
  <script type="module" src="./js/report/main.js"></script>
</body>

</html>
