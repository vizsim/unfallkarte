<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <title>Analyse-Report · Unfallkarte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Analyse-Report der Unfallkarte: Unfalllage, Einrichtungen, Straße, Verkehr und Lärm an einer Kreuzung oder Einrichtung – datenbasierte Auswertung, kein Gutachten." />
  <link rel="icon" href="stationary-bike-gym-svgrepo-com.svg" type="image/svg+xml">
  <!-- Datenbucket (B2) per fetch/CORS; eine Grundkarte gibt es hier nicht (die Report-Karte ist SVG). -->
  <link rel="preconnect" href="https://tiles.vizsim.de" crossorigin>
  <link rel="stylesheet" href="./js/report/report.css" />
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./index.html" title="Zur Karte">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#c1121f" stroke-width="4"/><text x="20" y="25.5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#111">30</text></svg>
        <span class="brand-name">Unfallkarte <span>/ Analyse-Report</span></span>
      </a>
      <!-- Statisch der Datenteil (so läuft die Live-Seite); mit REPORT_LEGAL (js/config/env.js)
           schaltet js/report/main.js Regelwerk-Version, Hinweis und den Brief-Tab frei. -->
      <span class="badge experimental" title="Experimentell: keine Gewähr, dass Zahlen und Schlussfolgerungen stimmen">Experimentell<span id="rw-version"></span></span>
      <span class="spacer"></span>
      <span class="note" id="report-note">Datenbasierte Auswertung aus den Daten der Unfallkarte – kein Gutachten, keine amtliche Feststellung.</span>
    </header>

    <div class="steps" role="tablist" aria-label="Ablauf">
      <!-- Nummern für den Datenteil; mit Rechtsteil zählt main.js den Brief mit (Druck = 3). -->
      <button class="step" role="tab" id="tab-report" aria-controls="view-report" data-tab="report"><span class="n">1</span>Report</button>
      <button class="step" role="tab" id="tab-brief" aria-controls="view-brief" data-tab="brief" hidden><span class="n">2</span>Brief</button>
      <button class="step" role="tab" id="tab-pdf" aria-controls="view-pdf" data-tab="pdf"><span class="n">2</span>Druckansicht (PDF)</button>
    </div>

    <section id="view-report" role="tabpanel" aria-labelledby="tab-report"></section>
    <section id="view-brief" role="tabpanel" aria-labelledby="tab-brief" hidden></section>
    <section id="view-pdf" role="tabpanel" aria-labelledby="tab-pdf" hidden></section>
  </div>
  <noscript>Der Analyse-Report braucht JavaScript.</noscript>
  <script type="module" src="./js/report/main.js"></script>
</body>

</html>
