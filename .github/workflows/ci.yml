# CI: Pipeline (ruff + pytest) und Frontend-Smoke-Tests (Playwright).
# Beide Jobs brauchen keine lokalen Daten: die pytest laufen im Dry-Run, das Frontend
# holt seine PMTiles per B2-Fallback aus dem public Bucket (kein Secret nötig).
#
# Action-Versionen: alle auf der Node-24-Laufzeit des Runners (Node 20 ist dort abgekündigt).
# Das ist unabhängig vom Node, mit dem UNSERE Tests laufen (setup-node: node-version 22).
name: CI

on:
  push:
    branches: [main, unfallkarte-2026]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      # setup-uv veröffentlicht seit v8 nur noch unveränderliche Releases — es gibt keinen
      # gleitenden Major-Tag (@v10) mehr, darum exakt gepinnt.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uvx ruff check
      - run: uv run pytest

  web:
    name: Frontend (Playwright-Smoke-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
