[project]
name = "unfallkarte"
version = "0.1.0"
description = "Pipeline und Viewer für Verkehrsunfälle in Deutschland (Unfallatlas)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.8",   # schnelles GeoIO (fgb/parquet) ohne fiona-Overhead
    "pandas>=2.2",
    "pyarrow>=16",    # parquet
    "requests>=2.32",
    "typer>=0.12",    # CLI
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",  # .env-Handling
    "tqdm>=4.66",
]

[project.scripts]
unfallkarte = "unfallkarte.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfallkarte"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# System-Binaries (NICHT via pip): tippecanoe + tile-join, osmium-tool, gdal-bin (ogr2ogr).
# b2-CLI via:  uv tool install b2
