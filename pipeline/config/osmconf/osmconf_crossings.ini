# Querungen/Übergänge: highway=crossing-Nodes (points) +
# footway/cycleway/path=crossing-Ways (lines). Exponiert den crossing-Wert
# (Klassifizierung) plus ein paar Barrierefreiheits-/Kontext-Tags. Kein other_tags.

[points]
osm_id=yes
attributes=crossing,highway,crossing:markings,kerb,tactile_paving,bicycle
other_tags=no

[lines]
osm_id=yes
attributes=crossing,highway,footway,cycleway,path,crossing:markings,kerb,tactile_paving,bicycle
other_tags=no
