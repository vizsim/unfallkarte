# Unfall-Jahres-Registry (Unfallatlas / Open Data).
# Neues Jahr hinzufügen = ein Block hier, KEIN Code-Edit.
#
# Quelle der ZIPs bisher: NRW-Open-Data-Mirror. Pro Jahr unterscheiden sich der
# Pfad der CSV INNERHALB des ZIPs und teils Spaltennamen (siehe `rename`).
# `csv_path` ist relativ zum entpackten ZIP-Inhalt.

download_base: "https://www.opengeodata.nrw.de/produkte/transport_verkehr/unfallatlas/"

years:
  "2017":
    zip: "Unfallorte2017_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2017_LinRef.txt"
    sep: ";"
  "2018":
    zip: "Unfallorte2018_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2018_LinRef.txt"
    sep: ";"
  "2019":
    zip: "Unfallorte2019_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2019_LinRef.txt"
    sep: ";"
  "2020":
    zip: "Unfallorte2020_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2020_LinRef.csv"
    sep: ";"
  "2021":
    zip: "Unfallorte2021_EPSG25832_CSV.zip"
    csv_path: "Unfallorte2021_EPSG25832_CSV/Unfallorte_2021_LinRef.txt"
    sep: ";"
  "2022":
    zip: "Unfallorte2022_EPSG25832_CSV.zip"
    csv_path: "Unfallorte2022_LinRef.csv"
    sep: ";"
  "2023":
    zip: "Unfallorte2023_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2023_LinRef.csv"
    sep: ";"
  # 2024 ist seit Juli 2025 verfügbar (alle Länder).
  # TODO Phase 1: zip-Name + internen csv_path + evtl. neue Spalten VERIFIZIEREN
  # (NRW-Mirror-Muster vs. unfallatlas.statistikportal.de).
  "2024":
    zip: "Unfallorte2024_EPSG25832_CSV.zip"
    csv_path: "csv/Unfallorte2024_LinRef.csv"
    sep: ";"
    verify: true   # markiert: vor Nutzung gegenprüfen

# Koordinaten-Spalten: Komma->Punkt, float, dann Point-Geometrie in EPSG:4326.
lon_col: "XGCSWGS84"
lat_col: "YGCSWGS84"
crs: "EPSG:4326"

# Spalten-Harmonisierung über alle Jahre (alt -> neu).
rename:
  UIDENTSTLAE: UIDENTSTLA
  ULICHTVERH: LICHT
  OBJECTID_1: OBJECTID
  OID_: OBJECTID
  IstStrassenzustand: USTRZUSTAND
  STRZUSTAND: USTRZUSTAND
  IstSonstige: IstSonstig

# Spalten, die nach dem Geocoding gedroppt werden (Exporter-Kompatibilität).
drop_columns:
  - LINREFX
  - LINREFY
  - XGCSWGS84
  - YGCSWGS84
  - UIDENTSTLA

# Output: Dateiname leitet sich aus min/max Jahr ab -> kein hartes "2017-2023".
output:
  subdir: "accidents"
  basename: "accidents_germany"   # final: accidents_germany_<min>-<max>_oid.parquet
