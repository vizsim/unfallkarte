# Tippecanoe-Profile (1:1 aus den alten Notebooks portiert).
# tiles.py übersetzt diese in tippecanoe-Flags. `layer` = interner Layer-Name
# = Teil des Frontend-Vertrags → nicht ändern, ohne addSources/addLayers mitzuziehen.

profiles:
  # Einzel-Unfälle (run_tippecanoe_accidents_single)
  accidents_single:
    layer: accidents
    minzoom: 11
    maxzoom: 13
    drop_rate: 0
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true

  # Cluster Zoom 6-8 (accumulate UKATEGORIE-One-Hot per sum -> Tortendiagramme)
  clusters_6_8:
    layer: clusters_6_8
    minzoom: 6
    maxzoom: 8
    drop_rate: 0
    cluster_distance: 25
    accumulate:
      - "UKATEGORIE__1:sum"
      - "UKATEGORIE__2:sum"
      - "UKATEGORIE__3:sum"
    no_feature_limit: true
    no_tile_size_limit: true
    maximum_tile_bytes: 1000000

  # Cluster Zoom 9-11
  clusters_9_11:
    layer: clusters_9_11
    minzoom: 9
    maxzoom: 11
    base_zoom: 11
    drop_rate: 0
    cluster_distance: 10
    accumulate:
      - "UKATEGORIE__1:sum"
      - "UKATEGORIE__2:sum"
      - "UKATEGORIE__3:sum"
    no_feature_limit: true
    no_tile_size_limit: true
    maximum_tile_bytes: 1000000

  # --- OSM-Layer (Phase 2) ---
  # POI/Polygon-Features (schools/health/playgrounds): Layer-Name wird je OSM-Layer
  # via layer_override gesetzt.
  osm_features:
    minzoom: 9
    maxzoom: 15
    drop_rate: 0
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true
    maximum_tile_bytes: 1000000

  # Hauptverkehrsstraßen (Linien). Layer-Name = Frontend-Vertrag (highways/highways_minor).
  highways_major:
    layer: highways
    minzoom: 6
    maxzoom: 14
    drop_rate: 0
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true

  highways_minor:
    layer: highways_minor
    minzoom: 13
    maxzoom: 14
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true

  # movebis (TU Dresden / Stadtradeln): Rad-Geschwindigkeiten (Linien, ~9,9 Mio Segmente,
  # Quelle bereits visits>=10). Layer `links` + Felder avg_speed_kmh/visits = Frontend-Vertrag.
  # Ab z9 sichtbar; bei niedrigem Zoom nur Hauptkorridore (gestufter visits-Filter via -j),
  # ab z13 alles. drop_densest + Tile-Byte-Budget als zusätzliches Sicherheitsnetz.
  movebis:
    layer: links
    minzoom: 9
    maxzoom: 14
    drop_densest_as_needed: true
    no_feature_limit: true
    # KEIN no_tile_size_limit — sonst greift maximum_tile_bytes nicht und die dichten
    # z9–z12-Kacheln blähen sich auf >1 MB. So klemmt drop_densest auf 500 KB.
    force_feature_limit: true
    maximum_tile_bytes: 500000
    # Sanft & gestuft: nur so viel wegfiltern wie nötig (max visits>=50 bei z9),
    # den Rest übernimmt drop_densest + Tile-Byte-Budget. z12+ = alles.
    feature_filter:
      "*": ["any",
            [">=", "$zoom", 12],
            ["all", [">=", "$zoom", 11], [">=", "visits", 20]],
            ["all", [">=", "$zoom", 10], [">=", "visits", 40]],
            [">=", "visits", 50]]

  # UBA-Verkehrsmengen Hauptverkehrsstraßen (Linien). Layer-Name = Frontend-Vertrag (`lines`).
  # Settings wie die bewährte Altdatei: volle Geometrie behalten, nichts vereinfachen/droppen.
  hvs_lines:
    layer: lines
    minzoom: 9
    maxzoom: 15
    no_tile_size_limit: true

  # UBA-Umgebungslärm (Lärmpegelklassen-Polygone). Layer-Name je Variante via
  # layer_override (laerm_hlq_den-polys / laerm_4120_hlq_night-polys = Frontend-Vertrag).
  # Flags 1:1 aus den alten Notebooks: nichts droppen/limitieren, coalesce gegen Tile-Größe.
  laerm:
    minzoom: 6
    maxzoom: 14
    drop_rate: 0
    drop_densest_as_needed: true
    coalesce: true
    coalesce_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true
    force_feature_limit: true

  # Telraam-Zählstellen (kurze Straßensegmente, Linien). Layer-Name = Frontend-Vertrag.
  # Wenige Features (~1,4k DE) → kein Dropping, ab z9 sichtbar, z14 überzoomt nach oben.
  telraam_segments:
    layer: telraam_segments
    minzoom: 9
    maxzoom: 14
    drop_rate: 0
    no_feature_limit: true
    no_tile_size_limit: true

  # OpenBikeSensor-Überholabstände (Punkte). Layer-Name = Frontend-Vertrag
  # (obs_data-points). Flags 1:1 aus dem Alt-Notebook: nichts vereinfachen/
  # limitieren, nur die dichtesten Punkte bei Bedarf droppen.
  obs_points:
    layer: obs_data-points
    minzoom: 6
    maxzoom: 14
    drop_rate: 0
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true
    force_feature_limit: true

  # (osm_crossings / osm_cycleways entfernt — Mapillary-Szenarien sc5/sc7 gedroppt.)

  # --- Szenarien (Phase 3): Dual-Layer (Punkte niedrig-zoom, Polygone hoch-zoom) ---
  # Layer-Name je Szenario via layer_override (z.B. scenario2-points/-polys).
  scenario_points:
    minzoom: 6
    maxzoom: 14
    drop_rate: 0
    drop_densest_as_needed: true
    no_feature_limit: true
    no_tile_size_limit: true
    force_feature_limit: true

  scenario_polys:
    minzoom: 14
    maxzoom: 15
    no_feature_limit: true
    no_tile_size_limit: true
    force_feature_limit: true
accidents_build:
  grouped_geojson: "accidents_grouped.geojson.gz"   # Zwischenstand in data/raw/accidents/
  single_output: "accidents_single.pmtiles"
  cluster_output: "combined_cluster.pmtiles"
  cluster_profiles: ["clusters_6_8", "clusters_9_11"]
