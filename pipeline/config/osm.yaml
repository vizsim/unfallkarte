# OSM-Build-Config: Geofabrik-Download + osmium-Vorfilter + ogr2ogr -> Tiles.
#
# Zwei Muster:
#   kind: poi  -> osmium tags-filter -> ogr2ogr GPKG (osmconf) -> gpkg-Layer nach
#                 tag_filters filtern -> fgb -> tippecanoe
#   kind: line -> osmium tags-filter -> ogr2ogr GeoJSON (ogr_layer) -> tippecanoe
#
# `osmium_filter` = Liste von tags-filter-Ausdrücken (osmium-Syntax).
# osmconf-Dateien liegen unter config/osmconf/.

geofabrik:
  url: "https://download.geofabrik.de/europe/germany-latest.osm.pbf"
  pbf: "germany-latest.osm.pbf"   # nach data/raw/osm/

layers:
  schools:
    kind: poi
    osmium_filter: ["nwr/amenity=school,kindergarten"]
    osmconf: "osmconf_schools.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      amenity: ["school", "kindergarten"]
    tippecanoe_layer: "germany_osm_schools"
    tile_profile: "osm_features"
    output: "osm/schools.pmtiles"

  health:
    kind: poi
    osmium_filter:
      - "nwr/amenity=hospital,clinic,doctors"
      - "nwr/healthcare"
      - "nwr/social_facility"
    osmconf: "osmconf_health.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      amenity: ["hospital", "clinic"]
      healthcare: ["rehabilitation", "centre"]
      healthcare_speciality: ["psychiatry"]
      social_facility: ["nursing_home", "assisted_living"]
      social_facility_for: ["senior", "disabled", "mental_health"]
    tippecanoe_layer: "germany_osm_health"
    tile_profile: "osm_features"
    output: "osm/health.pmtiles"

  playgrounds:
    kind: poi
    osmium_filter: ["nwr/leisure=playground"]
    osmconf: "osmconf_playgrounds.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      leisure: ["playground"]
    tippecanoe_layer: "germany_osm_playgrounds"
    tile_profile: "osm_features"
    output: "osm/playgrounds.pmtiles"

# Hinweis: Die Line-Layer crossings/cycleways wurden entfernt — sie waren nur
# Inputs der (nicht übernommenen) Mapillary-Szenarien sc5/sc7, kein eigenständiger
# Frontend-Kontextlayer. _build_line/_ogr2ogr bleiben für künftige Linien-Layer
# (z.B. maxspeed major/minor). osmconf.ini / osmconf_cycleways.ini bleiben als Template.
