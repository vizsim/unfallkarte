# OSM-Build-Config: Geofabrik-Download + osmium-Vorfilter -> FGB -> Tiles.
#
# Einheitlicher Flow je Layer:
#   osmium tags-filter -> Kategorie-PBF -> die `osm_layers` DIREKT mit pyogrio
#   lesen (osmconf via OSM_CONFIG_FILE) -> optional per `tag_filters` filtern (OR
#   über Tags) -> FlatGeobuf -> tippecanoe. Kein ogr2ogr/GPKG/GeoJSON.
#
# POI:   osm_layers ["points","multipolygons"] + tag_filters (osmium-Filter grob).
# Linie: osm_layers ["lines"], kein tag_filter (osmium-Filter selektiert die Ways).
# `osmium_filter` = Liste von tags-filter-Ausdrücken; osmconf unter config/osmconf/.

geofabrik:
  url: "https://download.geofabrik.de/europe/germany-latest.osm.pbf"
  pbf: "germany-latest.osm.pbf"   # nach data/raw/osm/

layers:
  schools:
    osmium_filter: ["nwr/amenity=school,kindergarten"]
    osmconf: "osmconf_schools.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      amenity: ["school", "kindergarten"]
    tippecanoe_layer: "germany_osm_schools"
    tile_profile: "osm_features"
    output: "osm/schools.pmtiles"

  # ÖPNV-Haltestellen: public_transport=platform (PTv2; Punkte, lineare Bahnsteige,
  # Polygone) + klassische highway=bus_stop-Nodes. Konsument: routing_bulk (ersetzt
  # dort die Overpass-Livesuche; Attribute fürs Popup und die Startpunkt-Gewichtung).
  # Hinweis: Stops, die als bus_stop-Node UND platform-Way gemappt sind, erscheinen
  # doppelt — für die Darstellung egal, bei Gewichtung ggf. deduplizieren.
  platforms:
    osmium_filter:
      - "nwr/public_transport=platform"
      - "n/highway=bus_stop"
    osmconf: "osmconf_platforms.ini"
    osm_layers: ["points", "lines", "multipolygons"]
    tag_filters:
      public_transport: ["platform"]
      highway: ["bus_stop"]
    tippecanoe_layer: "germany_osm_platforms"
    tile_profile: "osm_features"
    output: "osm/platforms.pmtiles"

  health:
    osmium_filter:
      - "nwr/amenity=hospital,clinic,doctors"
      - "nwr/healthcare"
      - "nwr/social_facility"
    osmconf: "osmconf_health.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      amenity: ["hospital", "clinic"]
      healthcare: ["rehabilitation", "centre"]
      healthcare_speciality: ["psychiatry"]
      social_facility: ["nursing_home", "assisted_living"]
      social_facility_for: ["senior", "disabled", "mental_health"]
    tippecanoe_layer: "germany_osm_health"
    tile_profile: "osm_features"
    output: "osm/health.pmtiles"

  playgrounds:
    osmium_filter: ["nwr/leisure=playground"]
    osmconf: "osmconf_playgrounds.ini"
    osm_layers: ["points", "multipolygons"]
    tag_filters:
      leisure: ["playground"]
    tippecanoe_layer: "germany_osm_playgrounds"
    tile_profile: "osm_features"
    output: "osm/playgrounds.pmtiles"

  # Hauptverkehrsstraßen-Netz mit maxspeed (osmconf.ini exponiert highway/maxspeed/
  # maxspeed:type/...). Frontend-Kontextlayer (maxspeed/maxspeed_minor) UND joinbare
  # Daten-Basis für Szenarien (sc1/3/6 lesen das fgb-Zwischenprodukt in data/raw/osm/).
  # Portiert aus prepare_network_pbf_to_filtered_geojson_to_pmtiles / _get_minor.
  maxspeed_major:
    osmium_filter:
      - "w/highway=motorway,trunk,primary,secondary,tertiary,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link"
    osmconf: "osmconf.ini"
    osm_layers: ["lines"]
    tippecanoe_layer: "highways"
    tile_profile: "highways_major"
    output: "osm/maxspeed_major.pmtiles"

  maxspeed_minor:
    osmium_filter: ["w/highway=unclassified,residential,living_street,road"]
    osmconf: "osmconf.ini"
    osm_layers: ["lines"]
    tippecanoe_layer: "highways_minor"
    tile_profile: "highways_minor"
    output: "osm/maxspeed_minor.pmtiles"

  # Querungen/Übergänge: highway=crossing-Nodes (points) + footway/cycleway/path=
  # crossing-Ways (lines). Eingefärbt nach `crossing`-Wert (Ampel/markiert/unmarkiert).
  # tag_filters greift dank OR-Semantik für BEIDE Geometrietypen sauber: Nodes über
  # highway=crossing, Ways über footway/cycleway/path=crossing → Stray-Nodes (Kerbs
  # der Way-Stützpunkte) fallen raus. crossing=no bewusst weggelassen (Negativ-Tag).
  # Erweiterbar: weitere crossing=*-Werte später nur im Frontend-Match ergänzen.
  crossings:
    osmium_filter:
      - "n/highway=crossing"
      - "w/footway=crossing"
      - "w/cycleway=crossing"
      - "w/path=crossing"
    osmconf: "osmconf_crossings.ini"
    osm_layers: ["points", "lines"]
    tag_filters:
      highway: ["crossing"]
      footway: ["crossing"]
      cycleway: ["crossing"]
      path: ["crossing"]
    tippecanoe_layer: "germany_osm_crossings"
    tile_profile: "osm_features"
    output: "osm/crossings.pmtiles"

  # cycleways wurde entfernt (nur Input des gedroppten Mapillary-Szenarios sc7).
  # osmconf_cycleways.ini bleibt als Template.
