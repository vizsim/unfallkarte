# Quellen-Metadata (von Hand gepflegt). Speist das generierte data/manifest.json.
# Pro Eintrag: Label + Attribution + woher das Datum kommt:
#   date: auto         -> Pipeline ermittelt den Datenstand beim Build
#   date: {fixed: ...} -> statischer Festwert (historische/seltene Daten)
#   live: true         -> externer Live-Layer, kein festes Datum
#
# `file` = Pfad relativ zu data/ (== Subfolder im B2-Bucket, b2 sync spiegelt 1:1).
# Skelett mit Beispielen — in den Phasen 1-3 vervollständigen.

datasets:
  accidents_single:
    file: "accidents/accidents_single.pmtiles"
    label: "Unfalldaten"
    attribution: "Unfallatlas der Statistischen Ämter (dl-de/by-2-0)"
    date: auto            # max. Jahr aus accidents.yaml

  accidents_cluster:
    file: "accidents/combined_cluster.pmtiles"
    label: "Unfälle (geclustert)"
    attribution: "Unfallatlas der Statistischen Ämter (dl-de/by-2-0)"
    date: auto

  osm_schools:
    file: "osm/schools.pmtiles"
    label: "Schulen & Kindergärten"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto            # aus `osmium fileinfo` der Geofabrik-PBF

  osm_health:
    file: "osm/health.pmtiles"
    label: "Gesundheit & Pflege"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  osm_playgrounds:
    file: "osm/playgrounds.pmtiles"
    label: "Spielplätze"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  osm_crossings:
    file: "osm/crossings.pmtiles"
    label: "Querungen/Übergänge"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto            # OSM-getrieben -> trackt PBF-Stand

  maxspeed_major:
    file: "osm/maxspeed_major.pmtiles"
    label: "Tempolimits (Hauptstraßen)"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  maxspeed_minor:
    file: "osm/maxspeed_minor.pmtiles"
    label: "Tempolimits (Nebenstraßen)"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  uber_speed:
    file: "traffic/uber_speed.pmtiles"
    label: "Pkw-Geschwindigkeiten (Berlin)"
    attribution: "Uber Movement, Q2 2019"
    date: { fixed: "2019-Q2" }

  movebis:
    file: "movebis/movebis.pmtiles"
    label: "Rad-Geschwindigkeiten (Movebis)"
    attribution: "© TU Dresden, Movebis (CC BY-NC)"
    date: { fixed: "2020" }   # Datenstand movebis 2020 (Segmente mit ≥10 Fahrten)

  bikelanes:
    live: true            # externer TILDA-Tile-Server, kein Build-Artefakt
    label: "Radinfrastruktur"
    attribution: "radinfra.de / TILDA"

  # --- Szenarien ---
  scenario1:
    file: "scenarios/scenario1_cluster_accidents_ms100.pmtiles"
    label: "Unfall-Cluster (Tempo-100-Straßen)"
    attribution: "Unfallatlas (dl-de/by-2-0), © OpenStreetMap (ODbL)"
    date: auto            # unfallgetrieben -> max. Unfalljahr

  scenario2:
    file: "scenarios/scenario2_accidents_close2schools.pmtiles"
    label: "Unfälle nahe Schulen"
    attribution: "Unfallatlas (dl-de/by-2-0), © OpenStreetMap (ODbL)"
    date: auto            # unfallgetrieben -> max. Unfalljahr

  scenario3:
    file: "scenarios/scenario3_tempo30_conti.pmtiles"
    label: "Tempo-30 durchgängig (50er-Lückenschlüsse)"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: osm            # OSM-getrieben (kein Unfallbezug) -> trackt PBF-Stand

  scenario6:
    file: "scenarios/scenario6_tempo50_30mbuffer_schulen.pmtiles"
    label: "Tempo-50-Straßen vor Schulen"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: osm            # OSM-getrieben (kein Unfallbezug) -> trackt PBF-Stand

  scenario8:
    file: "scenarios/scenario8_laerm_schulen.pmtiles"
    label: "Lärm vor Schulen"
    attribution: "Umweltbundesamt (UBA-Lärmkartierung), © OpenStreetMap (ODbL)"
    date: { fixed: "2021" }   # UBA-Lärmkartierung (lärmgetrieben, statisch)

  scenario9:
    file: "scenarios/scenario9_hotspots.pmtiles"
    label: "Unfallschwerpunkte (M Uko, vereinfacht)"
    attribution: "Unfallatlas der Statistischen Ämter (dl-de/by-2-0)"
    date: auto            # unfallgetrieben -> max. Unfalljahr

  # --- Kontextlayer UBA-Umgebungslärm (Hauptverkehrsstraßen, END-Lärmkartierung) ---
  laerm_den:
    file: "noise/laerm_den.pmtiles"
    label: "Lärm (Tag-Abend-Nacht)"
    attribution: "© Umweltbundesamt-DE (END-Lärmkartierung, Hauptverkehrsstraßen)"
    date: { fixed: "2021" }   # statische END-Kartierung (UBA-Layer 4110, Lden)

  laerm_night:
    file: "noise/laerm_night.pmtiles"
    label: "Lärm (Nacht)"
    attribution: "© Umweltbundesamt-DE (END-Lärmkartierung, Hauptverkehrsstraßen)"
    date: { fixed: "2021" }   # statische END-Kartierung (UBA-Layer 4120, Lnight)

  # --- Kontextlayer UBA-Verkehrsmengen (Hauptverkehrsstraßen) ---
  hvs:
    file: "uba/hvs_verkehrsmengen.pmtiles"
    label: "Verkehrsmengen (Hauptverkehrsstraßen)"
    attribution: "© Umweltbundesamt-DE (END-Lärmkartierung, Hauptverkehrsstraßen)"
    date: { fixed: "2021" }   # END 4. Runde, Bezugsjahr 2021 (Layer 8100, versionId 2021)

  # --- Verkehrsmengen SVZ (Producer: eigenes Repo vizsim/svz; hier nur die fertigen
  #     PMTiles gespiegelt). svz_de = Länder-Segmente (Layer `svz`) + Zählstellen-Punkte
  #     (Layer `svz_points`); svz_bast = bundesweiter BASt-Backbone A+B (Layer `bast`).
  #     Ersetzt fachlich den groben UBA-HVS-Layer (nur >3 Mio Kfz/Jahr) — der bleibt als
  #     Fallback-Backbone (hvs) für die 5 fehlenden Länder. ---
  svz:
    file: "svz/svz_de.pmtiles"
    label: "Verkehrsmengen (SVZ der Länder)"
    attribution: "Straßenverkehrszählung der Länder (dl-de/by-2-0 · CC-BY-4.0 · dl-de/zero-2-0)"
    date: { fixed: "2015–2024" }   # je Land unterschiedliches Erhebungsjahr (Feld `year`)

  svz_bast:
    file: "svz/svz_bast.pmtiles"
    label: "Verkehrsmengen Bundesfernstraßen (BASt)"
    attribution: "© BASt (Bundesfernstraßen A+B, SVZ 2021)"
    date: { fixed: "2021" }

  # --- Kontextlayer Telraam ---
  telraam_segments:
    file: "telraam/telraam_segments.pmtiles"
    label: "Telraam-Zählstellen"
    attribution: "© Telraam-Mitwirkende (CC BY-NC 4.0)"
    date: telraam         # Build-/Harvest-Datum (Segment-Standorte ändern sich selten)

  # --- Kontextlayer OpenBikeSensor (Überholabstände aus Community-Portalen) ---
  obs:
    file: "obs/obs_data.pmtiles"
    label: "Überholabstände (OpenBikeSensor)"
    attribution: "© OpenBikeSensor-Community (Portale)"
    date: obs             # Harvest-Datum (Build-Zeit; Portale liefern laufend neue Messungen)
    # Öffentliche OBS-Portale (api/export/events) — DACH-weit gezogen, dann auf DE geclippt.
    # Stand 2026-06: nantes.1metre.fr (FR, down) + openbikesensor.hlrs.de (offline) ausgelassen;
    # obs.adfc-ac.de liefert derzeit 404 → wird beim Fetch übersprungen (bleibt drin für Wiederkehr).
    portals:
      - "https://obs.adfc-brandenburg.de/"
      - "https://obs.adfc-bw.de/"
      - "https://obs.adfc-darmstadt.de/"
      - "https://obs.adfc-hessen.de/"
      - "https://obs.adfc-niedersachsen.de/"
      - "https://obs.adfc-osnabrueck.de/"
      - "https://obs.adfc-luebeck.de/"
      - "https://obs.adfc-ac.de/"
      - "https://obs.radentscheid-essen.de/"
      - "https://obs-portal.pub.solar/"
      - "https://portal.openbikesensor.org/"
      - "https://portal.openbikesensor.hamburg/"
      - "https://portal.1meter50.at/"
    # DE-Außengrenze (low-res) für den Clip; einmalig gezogen + gecacht.
    boundary_url: "https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/1_deutschland/4_niedrig.geo.json"

  # Die Mapillary-Mapping-Szenarien (sc4/5/7) werden in der neuen Implementierung
  # bewusst NICHT übernommen → keine mapillary_trafficsigns/-markings-Quellen hier.
