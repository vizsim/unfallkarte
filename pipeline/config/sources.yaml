# Quellen-Metadata (von Hand gepflegt). Speist das generierte data/manifest.json.
# Pro Eintrag: Label + Attribution + woher das Datum kommt:
#   date: auto         -> Pipeline ermittelt den Datenstand beim Build
#   date: {fixed: ...} -> statischer Festwert (historische/seltene Daten)
#   live: true         -> externer Live-Layer, kein festes Datum
#
# `file` = Pfad relativ zu data/ (== Subfolder im B2-Bucket, b2 sync spiegelt 1:1).
# Skelett mit Beispielen — in den Phasen 1-3 vervollständigen.

datasets:
  accidents_single:
    file: "accidents/accidents_single.pmtiles"
    label: "Unfalldaten"
    attribution: "Unfallatlas der Statistischen Ämter (dl-de/by-2-0)"
    date: auto            # max. Jahr aus accidents.yaml

  accidents_cluster:
    file: "accidents/combined_cluster.pmtiles"
    label: "Unfälle (geclustert)"
    attribution: "Unfallatlas der Statistischen Ämter (dl-de/by-2-0)"
    date: auto

  osm_schools:
    file: "osm/schools.pmtiles"
    label: "Schulen & Kindergärten"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto            # aus `osmium fileinfo` der Geofabrik-PBF

  osm_health:
    file: "osm/health.pmtiles"
    label: "Gesundheit & Pflege"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  osm_playgrounds:
    file: "osm/playgrounds.pmtiles"
    label: "Spielplätze"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  maxspeed_major:
    file: "osm/maxspeed_major.pmtiles"
    label: "Tempolimits (Hauptstraßen)"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  maxspeed_minor:
    file: "osm/maxspeed_minor.pmtiles"
    label: "Tempolimits (Nebenstraßen)"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: auto

  laerm_den:
    file: "noise/laerm_den.pmtiles"
    label: "Lärm (Tag-Abend-Nacht)"
    attribution: "Umweltbundesamt"
    date: { fixed: "2017" }   # statische Kartierung

  uber_speed:
    file: "traffic/uber_speed.pmtiles"
    label: "Pkw-Geschwindigkeiten (Berlin)"
    attribution: "Uber Movement, Q2 2019"
    date: { fixed: "2019-Q2" }

  bikelanes:
    live: true            # externer TILDA-Tile-Server, kein Build-Artefakt
    label: "Radinfrastruktur"
    attribution: "radverkehrsatlas / TILDA"

  # --- Szenarien ---
  scenario1:
    file: "scenarios/scenario1_cluster_accidents_ms100.pmtiles"
    label: "Unfall-Cluster (Tempo-100-Straßen)"
    attribution: "Unfallatlas (dl-de/by-2-0), © OpenStreetMap (ODbL)"
    date: auto            # unfallgetrieben -> max. Unfalljahr

  scenario2:
    file: "scenarios/scenario2_accidents_close2schools.pmtiles"
    label: "Unfälle nahe Schulen"
    attribution: "Unfallatlas (dl-de/by-2-0), © OpenStreetMap (ODbL)"
    date: auto            # unfallgetrieben -> max. Unfalljahr

  scenario6:
    file: "scenarios/scenario6_tempo50_30mbuffer_schulen.pmtiles"
    label: "Tempo-50-Straßen vor Schulen"
    attribution: "© OpenStreetMap-Mitwirkende (ODbL)"
    date: { fixed: "2025-07-31" }   # OSM-getrieben (kein Unfallbezug)

  # Die Mapillary-Mapping-Szenarien (sc4/5/7) werden in der neuen Implementierung
  # bewusst NICHT übernommen → keine mapillary_trafficsigns/-markings-Quellen hier.
